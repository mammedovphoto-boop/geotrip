<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>GeoTrip · Trip planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Тёмная экспедиционная анкета в стиле сайта GeoTrip: один блок вопросов на экран, итог всегда под рукой, заявка уходит в WhatsApp */
:root{
  --bg:#0d0c0b; --panel:#171513; --panel-2:#201d1a; --line:#2e2a26;
  --ink:#f3efe8; --mist:#aca59a; --ash:#7b746a;
  --red:#b8180a; --red-hi:#e0381c; --wa:#1f8f55;
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"Raleway", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
.wrap{max-width:760px;margin:0 auto;padding-block:clamp(24px,5vh,56px) 140px}
h1,h2{font-family:var(--serif);font-weight:900;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,54px);line-height:1.04}
h2{font-size:clamp(26px,4.4vw,36px);line-height:1.1}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font:600 12px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--mist)}
.brand i{width:28px;height:1px;background:var(--red-hi)}
.langs{display:flex;border:1px solid var(--line)}
.langs button{background:none;border:0;color:var(--mist);font:600 12px/1 var(--sans);letter-spacing:.16em;padding:10px 14px;cursor:pointer;transition:background .3s,color .3s}
.langs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.langs button:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
.intro{display:grid;gap:14px;margin:clamp(20px,3vh,30px) 0 clamp(24px,4vh,38px)}
.intro p{margin:0;color:var(--mist);max-width:36em}

.steps{display:flex;gap:6px;margin:0 0 22px}
.steps button{flex:1;height:22px;background:none;border:0;padding:10px 0;cursor:pointer;position:relative}
.steps button::after{content:"";position:absolute;inset:10px 0 auto;height:2px;background:var(--line);transition:background .5s var(--ease)}
.steps button.done::after{background:rgba(224,56,28,.5)}
.steps button.on::after{background:var(--red-hi)}
.steps button:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
.kick{font:600 11px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--red-hi);margin:0 0 10px}

.step{display:none}
.step.on{display:grid;gap:26px;animation:in .55s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.q{display:grid;gap:12px;min-width:0}
.q>label,.q>.lbl{font-weight:600;font-size:15px;color:var(--ink)}
.q small,.hint{color:var(--ash);font-size:13px;font-weight:400}
.hint{margin:-4px 0 0}
.sub{display:grid;gap:12px;padding:16px;border-left:2px solid var(--red-hi);background:var(--panel)}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opts--wide{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:grid;gap:3px;min-height:56px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:border-color .3s,background .3s}
.opt b{font-weight:600;font-size:15px}
.opt em{font-style:normal;font-size:13px;color:var(--mist)}
.opt span:hover{border-color:#4a443d}
.opt input:checked+span{border-color:var(--red-hi);background:#2a1410}
.opt input:focus-visible+span{outline:2px solid var(--red-hi);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .opt span{min-height:0;padding:10px 15px;border-radius:100px;font-size:14px}

.counters{display:grid;gap:8px}
.ctr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 14px 12px 16px;background:var(--panel);border:1px solid var(--line)}
.ctr>div:first-child{min-width:0}
.ctr b{display:block;font-weight:600}
.ctr em{display:block;font-style:normal;font-size:13px;color:var(--mist)}
.step-n{display:flex;align-items:center;gap:4px}
.step-n button{width:40px;height:40px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:400 20px/1 var(--sans);cursor:pointer;transition:border-color .3s}
.step-n button:hover{border-color:var(--red-hi)}
.step-n output{min-width:40px;text-align:center;font-family:var(--serif);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}

input[type=text],input[type=tel],input[type=date],input[type=time],textarea,select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:400 16px/1.4 var(--sans);padding:13px 15px;border-radius:0;transition:border-color .3s;min-width:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--red-hi)}
textarea{min-height:110px;resize:vertical}
.row2,.row3{display:grid;gap:10px}
.row2{grid-template-columns:1fr 1fr}
.row3{grid-template-columns:1.3fr .8fr 1fr}
.row2>*,.row3>*{min-width:0}
.fl{display:grid;gap:6px;font-size:13px;color:var(--mist)}
.toggle{display:flex;align-items:center;gap:10px;color:var(--mist);font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--red-hi)}
.range{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ink);margin:-8px 0 0}
.row2{align-items:end}
.ctr--sm{height:50px;padding:0 4px 0 15px}
.ctr--sm .step-n button{width:40px;height:40px}
.ctr--sm .step-n output{font-size:21px}
input[type=date]{height:50px}
.err{color:#ff8a70;font-size:13px;margin:0}
.flight{display:grid;gap:10px;padding:16px;background:var(--panel);border:1px solid var(--line)}
.flight b{font-size:15px;font-weight:600}
.flight .row2{grid-template-columns:1fr 1fr}
.flight .row2+.row2{grid-template-columns:1.4fr 1fr}
select{padding-right:8px;text-overflow:ellipsis}
@media (max-width:560px){.flight{padding:14px 12px}.flight input,.flight select{font-size:15px;padding:12px 10px}}
.range[hidden]{display:none}

.summary{background:var(--panel);border:1px solid var(--line);padding:18px 18px 16px}
.summary h3{font:600 11px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--mist);margin:0 0 12px}
.summary pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:400 14px/1.6 var(--sans);color:var(--ink)}
.send{display:grid;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:14px 24px;border:1px solid var(--red);background:var(--red);color:#fff;font:600 13px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .3s,border-color .3s}
.btn:hover{background:var(--red-hi);border-color:var(--red-hi)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn--wa{background:var(--wa);border-color:var(--wa)}
.btn--wa:hover{background:#26a564;border-color:#26a564}
.btn--ghost{background:none;border-color:var(--line);color:var(--mist)}
.btn--ghost:hover{background:var(--panel-2);border-color:#4a443d;color:var(--ink)}
.btn svg{width:20px;height:20px;flex:none}
.note{margin:0;color:var(--ash);font-size:13px}
.note b{color:var(--ink);font-weight:600;user-select:all}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(13,12,11,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.nav__in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav__n{font:600 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mist);font-variant-numeric:tabular-nums}
.nav .btn{min-height:48px;padding:12px 22px}
.nav .btn[hidden]{display:none}
.back{background:none;border:0;color:var(--mist);font:600 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:14px 4px}
.back:hover{color:var(--ink)}
.back[disabled]{visibility:hidden}

@media (max-width:560px){
  .row2,.row3{grid-template-columns:1fr 1fr}
  .row3>*:first-child{grid-column:1/-1}
  .opts{grid-template-columns:1fr 1fr}
  .opts--wide{grid-template-columns:1fr}
  .nav__n{display:none}
  body.started .intro{display:none}
}
@media (prefers-reduced-motion:reduce){.step.on{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div class="brand"><i></i><span data-t="brand"></span></div>
    <div class="langs" role="group" aria-label="Language"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
  </div>
  <header class="intro"><h1 data-t="h1"></h1><p data-t="lead"></p></header>
  <nav class="steps" id="steps"></nav>
  <form id="f" novalidate></form>
</main>

<div class="nav"><div class="nav__in">
  <button type="button" class="back" id="prev"></button>
  <span class="nav__n" id="count"></span>
  <button type="button" class="btn" id="next"></button>
</div></div>

   flex:'flexible dates',notyet:'no exact dates yet',none:'none',choice:'up to GeoTrip',notchosen:'none chosen',kids:'children',adults:'adults',ages:'ages'},
 nightsW:['night','nights'],daysW:['day','days'],months:['January','February','March','April','May','June','July','August','September','October','November','December']}
};
var L=DEFAULT_LANG;
try{var h=location.hash.replace('#','');if(h==='ru'||h==='en')L=h;else{var s=localStorage.getItem('gt_ank_lang');if(s==='ru'||s==='en')L=s}}catch(e){}

/* ───── состояние ───── */
var st={arrive:'',depart:'',season:-1,inAp:0,inTime:'',inNo:'',outAp:0,outTime:'',outNo:'',adults:2,kids:0,ages:'',occasion:-1,lang:0,
  hotel:0,dbl:1,twn:0,trp:0,sgl:0,fam:0,meals:0,car:0,cars:1,guide:1,transfer:true,regions:[],acts:[],heli:[],pace:1,budget:5,wish:'',name:'',phone:'',from:''};
var touched={cars:false,rooms:false},cur=0,KEY='gt_anketa_v4';
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv){for(var k in st)if(k in sv)st[k]=sv[k];touched=sv._t||touched}}catch(e){}
function save(){try{var o=JSON.parse(JSON.stringify(st));o._t=touched;localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}

/* ───── помощники ───── */
var f=document.getElementById('f');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function plural(n,w){if(L==='en')return n===1?w[0]:w[1];var a=n%10,b=n%100;return a===1&&b!==11?w[0]:(a>=2&&a<=4&&(b<10||b>=20)?w[1]:w[2])}
function radios(key,items,cls,wide){return '<div class="'+(cls||'chips')+(wide?' opts--wide':'')+'">'+items.map(function(it,i){var t=Array.isArray(it)?it:[it];return '<label class="opt"><input type="radio" name="'+key+'" value="'+i+'"'+(st[key]===i?' checked':'')+'><span>'+(cls?'<b>'+esc(t[0])+'</b>'+(t[1]?'<em>'+esc(t[1])+'</em>':''):esc(t[0]))+'</span></label>'}).join('')+'</div>'}
function checks(key,items){return '<div class="chips">'+items.map(function(it,i){return '<label class="opt"><input type="checkbox" name="'+key+'" value="'+i+'"'+(st[key].indexOf(i)>=0?' checked':'')+'><span>'+esc(it)+'</span></label>'}).join('')+'</div>'}
function ctr(key,b,em,mn,mx){return '<div class="ctr"><div><b>'+esc(b)+'</b>'+(em?'<em id="h-'+key+'">'+esc(em)+'</em>':'')+'</div><div class="step-n" data-ctr="'+key+'" data-min="'+mn+'" data-max="'+mx+'"><button type="button" aria-label="−">−</button><output id="o-'+key+'">'+st[key]+'</output><button type="button" aria-label="+">+</button></div></div>'}
function apSel(key){return '<select id="'+key+'" data-k="'+key+'">'+T[L].airports.map(function(a,i){return '<option value="'+i+'"'+(st[key]===i?' selected':'')+'>'+esc(a)+'</option>'}).join('')+'</select>'}
function inp(key,type,ph,ac){return '<input type="'+type+'" id="'+key+'" data-k="'+key+'" value="'+esc(st[key])+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+(ac?' autocomplete="'+ac+'"':'')+'>'}
function addDays(iso,n){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d}
function nights(){if(!st.arrive||!st.depart)return 0;return Math.round((new Date(st.depart+'T12:00:00')-new Date(st.arrive+'T12:00:00'))/864e5)}
function fmtRange(){var t=T[L];if(!st.arrive||nights()<1)return '';var a=new Date(st.arrive+'T12:00:00'),b=new Date(st.depart+'T12:00:00'),M=t.months;
  if(L==='ru')return a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()?a.getDate()+'–'+b.getDate()+' '+M[b.getMonth()]+' '+b.getFullYear():a.getDate()+' '+M[a.getMonth()]+(a.getFullYear()!==b.getFullYear()?' '+a.getFullYear():'')+' – '+b.getDate()+' '+M[b.getMonth()]+' '+b.getFullYear();
  return a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()?a.getDate()+'–'+b.getDate()+' '+M[b.getMonth()]+' '+b.getFullYear():a.getDate()+' '+M[a.getMonth()]+(a.getFullYear()!==b.getFullYear()?' '+a.getFullYear():'')+' – '+b.getDate()+' '+M[b.getMonth()]+' '+b.getFullYear()}
function dur(){var t=T[L],n=nights(),d=n+1;if(n<1)return '';return n+' '+plural(n,t.nightsW)+' / '+d+' '+plural(d,t.daysW)}
var BEDS={dbl:2,twn:2,trp:3,sgl:1,fam:4};
function autoFill(){var t=T[L],p=st.adults+st.kids,cap=t.cars[st.car]?t.cars[st.car][2]:4;
  if(!touched.cars)st.cars=Math.max(1,Math.ceil(p/cap));
  if(!touched.rooms){st.dbl=Math.floor(st.adults/2);st.sgl=st.adults%2;st.twn=0;st.trp=0;st.fam=st.kids?1:0}}

/* ───── шаги ───── */
function build(){
  var t=T[L];
  document.documentElement.lang=L;document.title='GeoTrip · '+(L==='ru'?'Анкета':'Trip planner');
  [].forEach.call(document.querySelectorAll('[data-t]'),function(el){el.textContent=t[el.dataset.t]});
  [].forEach.call(document.querySelectorAll('[data-lang]'),function(b){b.setAttribute('aria-pressed',b.dataset.lang===L?'true':'false')});
  document.getElementById('prev').textContent=t.back;document.getElementById('next').textContent=t.next;
  document.getElementById('steps').setAttribute('aria-label',t.stepsLabel);
  var R=t.rm;
  var S=[
   [t.s1k,t.s1,
     '<div class="flight"><b>✈ '+t.flIn+'</b><div class="row2"><label class="fl">'+t.date+inp('arrive','date')+'</label><label class="fl">'+t.time+inp('inTime','time')+'</label></div><div class="row2"><label class="fl">'+t.airport+apSel('inAp')+'</label><label class="fl">'+t.flight+inp('inNo','text',t.flightPh)+'</label></div></div>'+
     '<div class="flight"><b>✈ '+t.flOut+'</b><div class="row2"><label class="fl">'+t.date+inp('depart','date')+'</label><label class="fl">'+t.time+inp('outTime','time')+'</label></div><div class="row2"><label class="fl">'+t.airport+apSel('outAp')+'</label><label class="fl">'+t.flight+inp('outNo','text',t.flightPh)+'</label></div></div>'+
     '<p class="range" id="range"></p><p class="err" id="dErr" hidden>'+t.dErr+'</p>'+
     '<div class="q" id="seasonQ"><span class="lbl">'+t.season+'</span>'+radios('season',t.seasons)+'<p class="hint">'+t.flightH+'</p></div>'],
   [t.s2k,t.s2,'<div class="counters">'+ctr('adults',t.adults,t.adultsH,1,60)+ctr('kids',t.kids,t.kidsH,0,30)+'</div>'+
     '<div class="q" id="agesQ"><label for="ages">'+t.kidsAges+'</label>'+inp('ages','text',t.kidsAgesPh)+'</div>'+
     '<div class="q"><span class="lbl">'+t.occasion+'</span>'+radios('occasion',t.occasions)+'</div>'+
     '<div class="q"><span class="lbl">'+t.lang+'</span>'+radios('lang',t.langs)+'</div>'],
   [t.s3k,t.s3,'<div class="q"><span class="lbl">'+t.hotel+'</span>'+radios('hotel',t.hotels,'opts',true)+'</div>'+
     '<div class="q"><span class="lbl">'+t.rooms+' <small>'+t.roomsH+'</small></span><div class="counters">'+ctr('dbl',R.dbl[0],R.dbl[1],0,30)+ctr('twn',R.twn[0],R.twn[1],0,30)+ctr('trp',R.trp[0],R.trp[1],0,30)+ctr('sgl',R.sgl[0],R.sgl[1],0,30)+ctr('fam',R.fam[0],R.fam[1],0,20)+'</div><p class="hint" id="bedsH"></p></div>'+
     '<div class="q"><span class="lbl">'+t.meals+'</span>'+radios('meals',t.mealsO)+'</div>'],
   [t.s4k,t.s4,'<div class="q"><span class="lbl">'+t.car+'</span>'+radios('car',t.cars,'opts',true)+'</div>'+
     '<div class="counters">'+ctr('cars',t.carsN,' ',1,20)+'</div>'+
     '<div class="q"><span class="lbl">'+t.guide+'</span>'+radios('guide',t.guides,'opts',true)+'</div>'+
     '<label class="toggle"><input type="checkbox" data-k="transfer"'+(st.transfer?' checked':'')+'> '+t.transfer+'</label>'],
   [t.s5k,t.s5,'<div class="q"><span class="lbl">'+t.regions+' <small>'+t.any+'</small></span>'+checks('regions',t.regionsO)+'</div>'+
     '<div class="q"><span class="lbl">'+t.acts+' <small>'+t.any+'</small></span>'+checks('acts',t.actsO)+'</div>'+
     '<div class="q sub" id="heliQ"><span class="lbl">'+t.heli+' <small>'+t.any+'</small></span>'+checks('heli',t.heliO)+'</div>'+
     '<div class="q"><span class="lbl">'+t.pace+'</span>'+radios('pace',t.paceO)+'</div>'],
   [t.s6k,t.s6,'<div class="q"><span class="lbl">'+t.budget+'</span>'+radios('budget',t.budgetO,'opts')+'</div>'+
     '<div class="q"><label for="wish">'+t.wish+'</label><textarea id="wish" data-k="wish" placeholder="'+esc(t.wishPh)+'">'+esc(st.wish)+'</textarea></div>'],
   [t.s7k,t.s7,'<div class="row2"><div class="q"><label for="name">'+t.name+'</label>'+inp('name','text',t.namePh,'name')+'</div><div class="q"><label for="phone">'+t.phone+'</label>'+inp('phone','tel',t.phonePh,'tel')+'</div></div>'+
     '<div class="q"><label for="from">'+t.from+'</label>'+inp('from','text',t.fromPh,'country-name')+'</div>'+
     '<p class="err" id="err" hidden>'+t.err+'</p>'+
     '<div class="summary"><h3>'+t.sum+'</h3><pre id="sum"></pre></div>'+
     '<div class="send"><a class="btn btn--wa" id="waLink" href="https://wa.me/'+WA+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>'+t.send+'</a>'+
     '<button type="button" class="btn btn--ghost" id="copy">'+t.copy+'</button><p class="note">'+t.note+' <b>'+WA_SHOW+'</b>.</p></div>']
  ];
  f.innerHTML=S.map(function(s){return '<section class="step"><div><p class="kick">'+esc(s[0])+'</p><h2>'+esc(s[1])+'</h2></div>'+s[2]+'</section>'}).join('');
  var sb=document.getElementById('steps');sb.innerHTML='';
  S.forEach(function(s,i){var b=document.createElement('button');b.type='button';b.setAttribute('aria-label',t.step+' '+(i+1)+': '+s[1]);b.addEventListener('click',function(){go(i)});sb.appendChild(b)});
  wire();go(cur,true);
}
function wire(){
  [].forEach.call(f.querySelectorAll('[data-ctr]'),function(box){
    var k=box.dataset.ctr,mn=+box.dataset.min,mx=+box.dataset.max,bs=box.querySelectorAll('button');
    var set=function(d){st[k]=Math.max(mn,Math.min(mx,st[k]+d));if(k==='cars')touched.cars=true;if(BEDS[k])touched.rooms=true;if(k==='adults'||k==='kids')autoFill();refresh()};
    bs[0].addEventListener('click',function(){set(-1)});bs[1].addEventListener('click',function(){set(1)});
  });
  /* обработчики висят на самой форме: переживают перестройку разметки */
  document.getElementById('waLink').addEventListener('click',function(e){
    var ok=st.name.trim()&&st.phone.replace(/\D/g,'').length>=6;document.getElementById('err').hidden=!!ok;
    if(!ok){e.preventDefault();document.getElementById(st.name.trim()?'phone':'name').focus()}});
  document.getElementById('copy').addEventListener('click',function(){var b=this,t=msg(),done=function(){b.textContent=T[L].copied;setTimeout(function(){b.textContent=T[L].copy},2200)};
    var fb=function(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(x){}ta.remove()};
    try{navigator.clipboard.writeText(t).then(done,fb)}catch(x){fb()}});
}
f.addEventListener('change',function(e){var el=e.target,k=el.name||el.dataset.k;if(!k)return;
  if(el.type==='radio'){st[k]=+el.value;if(k==='car')autoFill()}
  else if(el.type==='checkbox'&&el.name){var v=+el.value,a=st[k],i=a.indexOf(v);if(el.checked&&i<0)a.push(v);if(!el.checked&&i>=0)a.splice(i,1);a.sort(function(x,y){return x-y})}
  else if(el.type==='checkbox')st[k]=el.checked;
  else if(el.tagName==='SELECT')st[k]=+el.value;
  else st[k]=el.value;
  refresh()});
f.addEventListener('input',function(e){var el=e.target,k=el.dataset.k;if(k&&el.tagName!=='SELECT'&&el.type!=='checkbox'){st[k]=el.value;refresh(true)}});
f.addEventListener('submit',function(e){e.preventDefault()});

function refresh(soft){
  var t=T[L];
  ['adults','kids','dbl','twn','trp','sgl','fam','cars'].forEach(function(k){var o=document.getElementById('o-'+k);if(o)o.textContent=st[k]});
  var n=nights(),r=document.getElementById('range');if(r){r.textContent=n>0?fmtRange()+' · '+dur():'';r.hidden=!(n>0)}
  var de=document.getElementById('dErr');if(de)de.hidden=!(st.arrive&&st.depart&&n<1);
  var dp=document.getElementById('depart');if(dp)dp.min=st.arrive||'';
  var sq=document.getElementById('seasonQ');if(sq)sq.hidden=!!(st.arrive&&st.depart);
  var aq=document.getElementById('agesQ');if(aq)aq.hidden=st.kids<1;
  var hq=document.getElementById('heliQ');if(hq)hq.hidden=st.acts.indexOf(0)<0;
  var ch=document.getElementById('h-cars');if(ch)ch.textContent=st.guide===3?'':t.carsH.replace('{n}',t.cars[st.car][2]);
  var p=st.adults+st.kids,beds=0;for(var k in BEDS)beds+=st[k]*BEDS[k];
  var bh=document.getElementById('bedsH');if(bh)bh.textContent=t.bedsH.replace('{p}',p).replace('{b}',beds);
  var s=document.getElementById('sum');if(s)s.textContent=msg().replace(/\*/g,'');
  var w=document.getElementById('waLink');if(w)w.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg());
  save();
}

/* ───── текст заявки для WhatsApp (жирный — *звёздочки*) ───── */
function msg(){
  var t=T[L],m=t.m,R=t.rm,o=[];
  var sec=function(icon,title,rows){rows=rows.filter(function(x){return x[1]!==''&&x[1]!=null});if(!rows.length)return;o.push('');o.push(icon+' *'+title+'*');rows.forEach(function(x){o.push(x[0]?x[0]+': '+x[1]:x[1])})};
  o.push('🌍 *'+m.title+'*');
  sec('👤',m.client,[[m.name,st.name.trim()],[m.from,st.from.trim()],[m.phone,st.phone.trim()]]);
  var dates=nights()>0?fmtRange():(st.arrive?st.arrive:(st.season>=0?t.seasons[st.season]+', '+m.notyet:m.notyet));
  var trav=st.adults+' '+m.adults+(st.kids?' + '+st.kids+' '+m.kids+(st.ages.trim()?' ('+m.ages+' '+st.ages.trim()+')':''):'');
  sec('📅',m.trip,[[m.dates,dates],[m.dur,dur()],[m.trav,trav],[m.purpose,st.occasion>=0?t.occasions[st.occasion]:''],[m.pace,t.paceO[st.pace]],[m.lang,t.langs[st.lang]]]);
  var fl=function(ap,tm,no,d){return t.airports[ap]+(d?', '+d:'')+(tm?', '+tm:'')+(no.trim()?', '+no.trim().toUpperCase():'')};
  var dm=function(v){if(!v)return '';var d=new Date(v+'T12:00:00');return d.getDate()+' '+t.months[d.getMonth()]};var dIn=dm(st.arrive),dOut=dm(st.depart);
  var noT=L==='ru'?'время не указано':'time not given';
  sec('✈️',m.flights,[[m.arr,fl(st.inAp,st.inTime||noT,st.inNo,dIn)],[m.dep,fl(st.outAp,st.outTime||noT,st.outNo,dOut)]]);
  var rooms=[];['dbl','twn','trp','sgl','fam'].forEach(function(k){if(st[k])rooms.push(st[k]+' × '+R[k][0]+' ('+R[k][1]+')')});
  sec('🏨',m.stay,[[m.hotel,t.hotels[st.hotel][0]],[m.rooms,rooms.join(', ')||m.none],[m.meals,t.mealsO[st.meals]]]);
  var self=st.guide===3;
  sec('🚙',m.trans,[[m.car,t.cars[st.car][0]+' ('+t.cars[st.car][1]+')'],[m.qty,String(st.cars)],[m.guide,t.guides[st.guide][0]],[m.transfer,self?'':(st.transfer?m.yes:m.no)]]);
  sec('📍',m.dest,[['',st.regions.length?st.regions.map(function(i){return t.regionsO[i]}).join(' • '):m.choice]]);
  var ex=st.acts.map(function(i){var n=t.actsO[i];if(i===0&&st.heli.length)n+=': '+st.heli.map(function(j){return t.heliO[j]}).join(', ');return n});
  sec('🏔️',m.exp,[['',ex.length?ex.join('\n'):m.notchosen]]);
  sec('💰',m.budget,[['',t.budgetO[st.budget]]]);
  sec('📝',m.wish,[['',st.wish.trim()||m.none]]);
  return o.join('\n');
}

function go(i,silent){
  var S=[].slice.call(f.querySelectorAll('.step')),t=T[L];
  cur=Math.max(0,Math.min(S.length-1,i));
  S.forEach(function(s,k){s.classList.toggle('on',k===cur)});
  [].forEach.call(document.getElementById('steps').children,function(b,k){b.className=k===cur?'on':(k<cur?'done':'');b.setAttribute('aria-current',k===cur?'step':'false')});
  document.getElementById('prev').disabled=cur===0;document.getElementById('next').hidden=cur===S.length-1;
  document.getElementById('count').textContent=t.step+' '+(cur+1)+' '+t.of+' '+S.length;
  document.body.classList.toggle('started',cur>0);
  refresh();
  if(!silent){var top=document.getElementById('steps').getBoundingClientRect().top+scrollY-12;if(scrollY>top)window.scrollTo({top:top,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
}
document.getElementById('prev').addEventListener('click',function(){go(cur-1)});
document.getElementById('next').addEventListener('click',function(){go(cur+1)});
[].forEach.call(document.querySelectorAll('[data-lang]'),function(b){b.addEventListener('click',function(){
  if(L===b.dataset.lang)return;
  /* язык гида по умолчанию следует за языком анкеты, если его не меняли */
  L=b.dataset.lang;st.lang=({0:1,1:0,2:2})[st.lang];
  try{localStorage.setItem('gt_ank_lang',L)}catch(e){}
  try{history.replaceState(null,'','#'+L)}catch(e){}
  build()})});
build();
})();
</script>
